server:
  port: 8080

spring:
  application:
    name: evops-base
  profiles:
    active: dev
  aop:
    proxy-target-class: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:file:./data/evops;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

evops:
  sensitive:
    enabled: true                                   # 敏感词扫描总开关
    word-file: ./data/sensitive-words.txt           # 词库文件：每行 词|级别（BLOCK/MASK）
    reload-interval-ms: 30000                       # 词库热更新：定时检测文件 mtime 的间隔

logging:
  level:
    com.evops: INFO
